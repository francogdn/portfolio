  </g>
<g>
    <rect x="580" y="120" width="120" height="56" rx="6" fill="#14212b"/>
    <text x="640.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">Converted invoices</text>
