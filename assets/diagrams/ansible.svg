<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Inventory → playbooks → reports">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfd9de"/>
      <stop offset="100%" stop-color="#e7eef1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6f6a"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="url(#bg)"/>
  <text x="28" y="36" font-family="Georgia, serif" font-size="18" fill="#14212b">Inventory → playbooks → reports</text>

<line x1="200" y1="148" x2="260" y2="148" stroke="#1f6f6a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="390" y1="148" x2="450" y2="148" stroke="#1f6f6a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="148" x2="640" y2="148" stroke="#1f6f6a" stroke-width="2" marker-end="url(#arrow)"/>
<g>
    <rect x="40" y="120" width="160" height="56" rx="6" fill="#14212b"/>
    <text x="120.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">Inventory + roles</text>
  </g>
<g>
    <rect x="260" y="120" width="130" height="56" rx="6" fill="#14212b"/>
    <text x="325.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">Playbooks</text>
  </g>
<g>
    <rect x="450" y="120" width="160" height="56" rx="6" fill="#14212b"/>
    <text x="530.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">Report callbacks</text>
  </g>
<g>
    <rect x="640" y="120" width="60" height="56" rx="6" fill="#14212b"/>
    <text x="670.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">Health summaries</text>
  </g>
</svg>