<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="JSON menu → browser launcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfd9de"/>
      <stop offset="100%" stop-color="#e7eef1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6f6a"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="url(#bg)"/>
  <text x="28" y="36" font-family="Georgia, serif" font-size="18" fill="#14212b">JSON menu → browser launcher</text>

<line x1="200" y1="148" x2="280" y2="148" stroke="#1f6f6a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="690" y1="148" x2="80" y2="148" stroke="#1f6f6a" stroke-width="2" marker-end="url(#arrow)"/>
<g>
    <rect x="80" y="120" width="120" height="56" rx="6" fill="#14212b"/>
    <text x="140.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">menu.json</text>
  </g>
<g>
    <rect x="280" y="120" width="170" height="56" rx="6" fill="#14212b"/>
    <text x="365.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">Static launcher UI</text>
  </g>
<g>
    <rect x="520" y="120" width="170" height="56" rx="6" fill="#14212b"/>
    <text x="605.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e7eef1">Optional save endpoint</text>
  </g>
</svg>